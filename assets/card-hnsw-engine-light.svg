<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="hnsw-engine: HNSW vector search built from the original paper. Queries per second at recall 0.95 or better on SIFT-1M, one thread: Exact search (FAISS flat) 114; hnsw-engine (Python + Numba) 4,447; hnswlib (C++) 6,193; FAISS HNSW (C++) 10,301."><title>hnsw-engine: HNSW vector search built from the original paper. Queries per second at recall 0.95 or better on SIFT-1M, one thread: Exact search (FAISS flat) 114; hnsw-engine (Python + Numba) 4,447; hnswlib (C++) 6,193; FAISS HNSW (C++) 10,301.</title><style>.still{display:none}@media (prefers-reduced-motion: reduce){.motion{display:none}.still{display:inline}}</style><rect x="0.5" y="0.5" width="879" height="299" rx="14" fill="#f6f8fa" stroke="#d1d9e0"/><text x="32" y="46" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#bc4c00" text-anchor="start" letter-spacing="1.4">VECTOR SEARCH</text><text x="31" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#1f2328" text-anchor="start" letter-spacing="-0.5">hnsw-engine</text><text x="32" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">HNSW built from the original paper, twice:</text><text x="32" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">a readable reference and a compiled engine.</text><line x1="32" y1="157" x2="352" y2="157" stroke="#d1d9e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="32" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="20" font-weight="700