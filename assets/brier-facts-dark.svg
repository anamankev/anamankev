<svg xmlns="http://www.w3.org/2000/svg" width="418" height="330" viewBox="0 0 418 330" role="img" aria-label="brier: a prediction-market exchange in Rust, built to a regulated venue&#x27;s standard, with play money. 12.3 million orders matched per second on one core; 1,000 crashes under load with no acknowledged order lost; 10 million commands with no divergence from an independent reference engine."><title>brier: a prediction-market exchange in Rust, built to a regulated venue&#x27;s standard, with play money. 12.3 million orders matched per second on one core; 1,000 crashes under load with no acknowledged order lost; 10 million commands with no divergence from an independent reference engine.</title><style>.still{display:none}@media (prefers-reduced-motion: reduce){.motion{display:none}.still{display:inline}}</style><rect x="3.5" y="3.5" width="411" height="323" rx="12" fill="#161b22" stroke="#30363d"/><text x="28" y="50" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#f0883e" text-anchor="start" letter-spacing="1.4">MARKET INFRASTRUCTURE</text><text x="27" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.5">brier</text><text x="28" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="start">A prediction-market exchange in Rust, built</text><text x="28" y="137" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="start">to a regulated venue&#x27;s standard. Play money.</text><line x1="28" y1="172" x2="390" y2="172" stroke="#30363d" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="28" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.3">12.3M</text><text x="128" y="199" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">orders matched per second, one core</text><line x1="28" y1="216" x2="390" y2="216" stroke="#30363d" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="28" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.3">1,000</text><text x="128" y="243" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">crashes under load, 0 acked orders lost</text><line x1="28" y1="260" x2="390" y2="260" stroke="#30363d" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="28" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.3">10M</text><text x="128" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">commands vs a reference engine, 0 diffs</text></svg>
