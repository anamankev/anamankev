<svg xmlns="http://www.w3.org/2000/svg" width="418" height="330" viewBox="0 0 418 330" role="img" aria-label="hnsw-engine: HNSW vector search built from the original paper, twice. 4,447 queries per second at recall 0.95 or better on one million vectors, 39 times faster than exact search, 336 tests."><title>hnsw-engine: HNSW vector search built from the original paper, twice. 4,447 queries per second at recall 0.95 or better on one million vectors, 39 times faster than exact search, 336 tests.</title><style>.still{display:none}@media (prefers-reduced-motion: reduce){.motion{display:none}.still{display:inline}}</style><rect x="3.5" y="3.5" width="411" height="323" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="28" y="50" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#bc4c00" text-anchor="start" letter-spacing="1.4">VECTOR SEARCH</text><text x="27" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1f2328" text-anchor="start" letter-spacing="-0.5">hnsw-engine</text><text x="28" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#59636e" text-anchor="start">HNSW built from the original paper, twice:</text><text x="28" y="137" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#59636e" text-anchor="start">a readable reference and a compiled engine.</text><line x1="28" y1="172" x2="390" y2="172" stroke="#d1d9e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="28" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2328" text-anchor="start" letter-spacing="-0.3">4,447</text><text x="128" y="199" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">queries/s at recall ≥ 0.95, 1M vectors</text><line x1="28" y1="216" x2="390" y2="216" stroke="#d1d9e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="28" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2328" text-anchor="start" letter-spacing="-0.3">39×</text><text x="128" y="243" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">faster than exact search</text><line x1="28" y1="260" x2="390" y2="260" stroke="#d1d9e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="28" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2328" text-anchor="start" letter-spacing="-0.3">336</text><text x="128" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">tests; two engines, one graph</text></svg>
